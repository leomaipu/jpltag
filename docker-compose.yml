# Solo para DESARROLLO LOCAL — `docker compose up --build` levanta jpltag
# junto a un Postgres y un Valkey propios, para probar sin tocar nada del
# servidor real.
#
# En producción esto NO se usa: el despliegue en maiproject.cl genera su
# propio compose.yaml (con la imagen ya construida, los secretos reales en
# /opt/maiproject/secretos/apps/jpltag.env y /opt/maiproject/apps/jpltag/
# secretos/app.env, y los volúmenes de datos en /maipu/data/files/jpltag/)
# a través del script de despliegue del servidor — ver DESPLIEGUE.md.

services:
  jpltag:
    build:
      context: .
      dockerfile: Dockerfile
    image: jpltag:dev
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: clave-insegura-solo-para-desarrollo-local
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://jpltag:jpltag@db:5432/jpltag
      VALKEY_URL: redis://valkey:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - jpltag_media_dev:/app/media
      - jpltag_salidas_dev:/app/salidas

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jpltag
      POSTGRES_PASSWORD: jpltag
      POSTGRES_DB: jpltag
    volumes:
      - jpltag_db_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jpltag"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jpltag_db_dev:
  jpltag_media_dev:
  jpltag_salidas_dev:
